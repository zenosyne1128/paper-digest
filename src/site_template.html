<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paper Digest</title>
<meta name="theme-color" content="#1b1a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paper Digest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{
  --paper:#f5efe3; --ink:#1b1a17; --muted:#6f685c; --line:#d9cfbd; --card:#fffdf8;
  --serif:Georgia,"Songti SC","Noto Serif SC","Source Han Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* masthead */
.strip{background:var(--ink);color:var(--paper);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:calc(8px + env(safe-area-inset-top)) 0 8px}
.strip .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mast{text-align:center;padding:30px 0 18px;border-bottom:4px double var(--ink)}
.mast h1{font-family:var(--serif);font-size:clamp(40px,9vw,84px);line-height:1;margin:0;letter-spacing:-.02em;font-weight:900}
.mast p{margin:10px 0 0;color:var(--muted);font-size:14px;letter-spacing:.08em}

/* toolbar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 0;position:sticky;top:0;background:var(--paper);z-index:5;border-bottom:1px solid var(--line)}
.chip{border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:6px 16px;border-radius:999px;font:600 14px var(--sans);cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper)}
.bar input{flex:1;min-width:160px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font:14px var(--sans);color:var(--ink);outline:none}
.bar input:focus{border-color:var(--ink)}

/* hero */
.hero{margin:26px 0;border-radius:20px;padding:34px;color:#fff;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start}
.hero .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.85;font-weight:700}
.hero h2{font-family:var(--serif);font-size:clamp(24px,4vw,40px);line-height:1.2;margin:10px 0 12px}
.hero .why{font-size:17px;line-height:1.75;margin:0 0 16px;max-width:60ch}
.hero .authors{opacity:.85;font-size:14px;margin:0 0 14px}
.hero .tag{background:rgba(255,255,255,.2);color:#fff}
.hero .btn{background:#fff;color:var(--ink);border-color:#fff}
.hero .ghost{border-color:rgba(255,255,255,.7);color:#fff}
.hero .more{border-top-color:rgba(255,255,255,.35);color:#fff}
.hero .more h4{color:rgba(255,255,255,.8)}

/* score medallion */
.score{flex:none;width:68px;height:68px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:24px;line-height:1;border:4px solid currentColor}
.score small{font:600 9px var(--sans);letter-spacing:.1em;color:var(--muted);margin-top:3px}
.hero .score{width:104px;height:104px;font-size:40px;border-width:6px}
.hero .score small{font-size:11px}

/* grid */
.issue-h{font-family:var(--serif);font-size:22px;margin:34px 0 4px;display:flex;align-items:baseline;gap:12px}
.issue-h span{font:13px var(--sans);color:var(--muted)}
.issue-h::after{content:"";flex:1;border-top:1px solid var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px;margin:18px 0 10px}
.card{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(0,0,0,.45)}
.card .band{padding:10px 18px;color:#fff;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.card .body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.card .top{display:flex;gap:14px;align-items:flex-start}
.card h3{font-family:var(--serif);font-size:19px;line-height:1.3;margin:0}
.card .authors{font-size:13px;color:var(--muted);margin:0}
.card .why{font-size:15px;margin:0}
.read h3,.read h2{opacity:.55}

.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:#ece4d3;color:#4b453b}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:6px}
.btn,.ghost{font:600 14px var(--sans);padding:8px 16px;border-radius:999px;border:1.5px solid var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn{background:var(--ink);color:var(--paper)}
.ghost{background:transparent;color:var(--ink)}
.ghost.fav{background:#ffc914;border-color:#ffc914;color:var(--ink)}
.more{border-top:1px dashed var(--line);padding-top:10px;font-size:14px;color:#3d382f}
.more h4{margin:8px 0 2px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.more p{margin:0 0 6px}
.kw{background:var(--card);border-radius:16px;padding:20px;margin-top:18px;box-shadow:0 1px 0 var(--line)}
.kw h2{font-family:var(--serif);font-size:20px;margin:0 0 4px}
.kw p{margin:0 0 12px;font-size:13px;color:var(--muted)}
.kw .tag{cursor:pointer;border:0;font:13px var(--sans);padding:4px 12px}
.kw .tag:hover{background:var(--ink);color:var(--paper)}
.kw .acts{margin-top:16px}
.empty{text-align:center;color:var(--muted);padding:70px 0;font-family:var(--serif);font-size:20px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:40px 0 calc(40px + env(safe-area-inset-bottom));letter-spacing:.08em}

@media(max-width:640px){
  .hero{grid-template-columns:1fr;padding:24px}
  .hero .score{width:76px;height:76px;font-size:28px;order:-1}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="strip"><div class="wrap"><span id="issueLabel"></span><span id="stats"></span></div></div>
<div class="wrap">
  <header class="mast">
    <h1>Paper Digest</h1>
    <p>每三天一期 · 为你精选的方法学与遗传统计论文</p>
  </header>
  <nav class="bar">
    <button class="chip" data-view="latest">最新一期</button>
    <button class="chip" data-view="all">全部往期</button>
    <button class="chip" data-view="fav">★ 收藏</button>
    <button class="chip" id="kwBtn">关键词</button>
    <input id="q" type="search" placeholder="搜索标题、作者、关键词…">
  </nav>
  <section id="kwPanel" class="kw" hidden></section>
  <main id="main"></main>
  <footer>PAPER DIGEST · 由 GitHub Actions 自动生成 · 更新于 <span id="updated"></span></footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const PAPERS = DATA.papers, COLORS = ['#e4572e','#1f7a8c','#5b5f97','#c2185b','#2e7d32','#b7791f'];
const store = {
  get(k){ try { return new Set(JSON.parse(localStorage.getItem(k) || '[]')); } catch(e){ return new Set(); } },
  set(k,s){ try { localStorage.setItem(k, JSON.stringify([...s])); } catch(e){} }
};
const favs = store.get('pd-fav'), read = store.get('pd-read'), open = new Set();
const state = { view:'latest', q:'' };
const issues = [...new Set(PAPERS.map(p => p.issue))].sort().reverse();

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (k === 'on') for (const [e,f] of Object.entries(v)) el.addEventListener(e,f);
    else if (k === 'style') el.style.cssText = v;
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid) el.append(kid);
  return el;
}
const scoreColor = s => s == null ? '#888' : s >= 8 ? '#15803d' : s >= 6 ? '#b7791f' : s >= 4 ? '#d9580d' : '#c81e1e';
const scoreText = s => s == null ? '–' : Number(s).toFixed(1);
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : null;
const colorOf = p => COLORS[PAPERS.indexOf(p) % COLORS.length];
const authorsOf = p => (p.authors || []).slice(0,5).join(', ') + ((p.authors || []).length > 5 ? ' 等' : '');

function medallion(p){
  return h('div', {class:'score', style:'color:'+scoreColor(p.score), title:'相关度评分'}, scoreText(p.score), h('small', {}, '/ 10'));
}
function actions(p){
  const url = safeUrl(p.link);
  const isFav = favs.has(p.key), isOpen = open.has(p.key);
  return h('div', {class:'acts'},
    url && h('a', {class:'btn', href:url, target:'_blank', rel:'noopener', on:{click(){ read.add(p.key); store.set('pd-read', read); render(); }}}, '阅读原文 →'),
    h('button', {class:'ghost' + (isFav ? ' fav' : ''), on:{click(){ isFav ? favs.delete(p.key) : favs.add(p.key); store.set('pd-fav', favs); render(); }}}, isFav ? '★ 已收藏' : '☆ 收藏'),
    h('button', {class:'ghost', on:{click(){ isOpen ? open.delete(p.key) : open.add(p.key); render(); }}}, isOpen ? '收起' : '摘要')
  );
}
function details(p){
  if (!open.has(p.key)) return null;
  return h('div', {class:'more'},
    p.score_reason && h('h4', {}, '评分理由'), p.score_reason && h('p', {}, p.score_reason),
    h('h4', {}, '原文摘要'), h('p', {}, p.abstract || '暂无摘要。'));
}
const tags = p => h('div', {class:'tags'}, (p.matched_keywords || []).map(k => h('span', {class:'tag'}, k)));

function hero(p){
  return h('section', {class:'hero' + (read.has(p.key) ? ' read' : ''), style:'background:'+colorOf(p)},
    h('div', {},
      h('div', {class:'kicker'}, '本期头条 · ' + (p.source || '') + ' · ' + (p.date || '')),
      h('h2', {}, p.title),
      h('p', {class:'authors'}, authorsOf(p)),
      h('p', {class:'why'}, p.chinese_explanation || ''),
      tags(p), h('div', {style:'height:14px'}), actions(p), details(p)),
    medallion(p));
}
function card(p){
  return h('article', {class:'card' + (read.has(p.key) ? ' read' : '')},
    h('div', {class:'band', style:'background:'+colorOf(p)}, h('span', {}, p.source || ''), h('span', {}, p.date || '')),
    h('div', {class:'body'},
      h('div', {class:'top'}, medallion(p), h('h3', {}, p.title)),
      h('p', {class:'authors'}, authorsOf(p)),
      h('p', {class:'why'}, p.chinese_explanation || ''),
      tags(p), actions(p), details(p)));
}
function matches(p){
  if (!state.q) return true;
  const hay = [p.title, (p.authors || []).join(' '), (p.matched_keywords || []).join(' '), p.chinese_explanation, p.source].join(' ').toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
const byScore = (a,b) => (b.score || 0) - (a.score || 0);

function render(){
  document.querySelectorAll('.chip[data-view]').forEach(c => c.classList.toggle('on', c.dataset.view === state.view));
  const main = document.getElementById('main');
  main.replaceChildren();
  let list = PAPERS.filter(matches);
  if (state.view === 'fav') list = list.filter(p => favs.has(p.key));
  if (state.view === 'latest' && !state.q) list = list.filter(p => p.issue === issues[0]);
  if (!list.length){
    main.append(h('div', {class:'empty'}, PAPERS.length ? (state.view === 'fav' ? '还没有收藏的论文。' : '没有匹配的论文。') : '还没有任何一期内容，等待第一次自动运行。'));
    return;
  }
  if (state.view === 'latest' && !state.q){
    list.sort(byScore);
    main.append(hero(list[0]));
    if (list.length > 1) main.append(h('div', {class:'grid'}, list.slice(1).map(card)));
    return;
  }
  for (const issue of issues){
    const group = list.filter(p => p.issue === issue).sort(byScore);
    if (!group.length) continue;
    main.append(h('h2', {class:'issue-h'}, issue, h('span', {}, group.length + ' 篇')), h('div', {class:'grid'}, group.map(card)));
  }
}

function renderKeywords(){
  const kws = DATA.keywords || [], url = safeUrl(DATA.keywords_edit_url);
  const q = document.getElementById('q');
  document.getElementById('kwPanel').replaceChildren(
    h('h2', {}, '抓取关键词 · ' + kws.length + ' 个'),
    h('p', {}, '每次自动运行都会按这些关键词筛选新论文。点击任意关键词可在已收录的论文中搜索。'),
    h('div', {class:'tags'}, kws.map(k => h('button', {class:'tag', on:{click(){ q.value = k; state.q = k; state.view = 'all'; render(); }}}, k))),
    h('div', {class:'acts'}, url
      ? [h('a', {class:'btn', href:url, target:'_blank', rel:'noopener'}, '在 GitHub 上添加 / 修改关键词 →'),
         h('span', {style:'font-size:13px;color:var(--muted)'}, '每行一个，提交后下一次运行生效')]
      : h('span', {style:'font-size:13px;color:var(--muted)'}, '本地预览：直接编辑项目里的 keywords.txt（每行一个）。发布到 GitHub 后这里会出现编辑按钮。')));
}
renderKeywords();
document.getElementById('kwBtn').addEventListener('click', e => {
  const panel = document.getElementById('kwPanel');
  panel.hidden = !panel.hidden;
  e.currentTarget.classList.toggle('on', !panel.hidden);
});
document.querySelectorAll('.chip[data-view]').forEach(c => c.addEventListener('click', () => { state.view = c.dataset.view; render(); }));
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
const latest = PAPERS.filter(p => p.issue === issues[0]);
document.getElementById('issueLabel').textContent = issues.length ? '第 ' + issues.length + ' 期 · ' + issues[0] : '创刊准备中';
document.getElementById('stats').textContent = '本期 ' + latest.length + ' 篇 · 累计 ' + PAPERS.length + ' 篇';
document.getElementById('updated').textContent = DATA.updated || '';
render();
</script>
</body>
</html>
