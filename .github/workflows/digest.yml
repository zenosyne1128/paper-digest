name: Paper Digest

on:
  schedule:
    # 08:00 UTC on the 1st, 4th, 7th … 28th. Cron has no "every 3 days", so the
    # gap around month end varies by a day; already-published papers are skipped.
    - cron: "0 8 1,4,7,10,13,16,19,22,25,28 * *"
  workflow_dispatch:   # manual "Run workflow" button in the Actions tab

permissions:
  contents: write      # lets the job commit docs/ (the web app) back to the repo

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Fetch → score → build web app → send email
        env:
          # Only the key for the provider chosen in config.yaml needs to exist.
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python main.py --from $(date -d '3 days ago' +%Y-%m-%d) --to $(date +%Y-%m-%d)

      - name: Publish web app (commit docs/ → GitHub Pages)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "digest: $(date +%Y-%m-%d)"
          git push
